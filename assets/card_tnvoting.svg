  <!-- === GOAT FACE === -->
  <g class="goat-face" opacity="0.06" transform="translate(362.5, 5.0) scale(0.35)">
    <g filter="url(#goatGlow)">
      <!-- Left Horn -->
      <path d="M 155 200 Q 120 120 90 50 Q 85 35 100 40 Q 130 55 150 100 Q 165 140 170 185" fill="none" stroke="url(#goatGoldGrad)" stroke-width="12" stroke-linecap="round" />
      <!-- Right Horn -->
      <path d="M 345 200 Q 380 120 410 50 Q 415 35 400 40 Q 370 55 350 100 Q 335 140 330 185" fill="none" stroke="url(#goatGoldGrad)" stroke-width="12" stroke-linecap="round" />
      <!-- Left Ear -->
      <path d="M 145 210 Q 90 195 70 230 Q 60 260 100 260 Q 130 258 155 240" fill="url(#goatGoldGrad)" opacity="0.7" />
      <!-- Right Ear -->
      <path d="M 355 210 Q 410 195 430 230 Q 440 260 400 260 Q 370 258 345 240" fill="url(#goatGoldGrad)" opacity="0.7" />
      <!-- Head -->
      <ellipse cx="250" cy="300" rx="120" ry="140" fill="url(#goatGoldGrad)" opacity="0.5" />
      <!-- Forehead ridge -->
      <path d="M 170 230 Q 250 200 330 230" fill="none" stroke="url(#goatGoldGrad)" stroke-width="4" opacity="0.6" />
      <!-- Left Eye -->
      <ellipse cx="200" cy="280" rx="22" ry="16" fill="#000" opacity="0.9" />
      <ellipse cx="205" cy="278" rx="8" ry="8" fill="url(#goatGoldGrad)" opacity="0.9" />
      <ellipse cx="207" cy="276" rx="3" ry="3" fill="#fff" opacity="0.8" />
      <!-- Right Eye -->
      <ellipse cx="300" cy="280" rx="22" ry="16" fill="#000" opacity="0.9" />
      <ellipse cx="295" cy="278" rx="8" ry="8" fill="url(#goatGoldGrad)" opacity="0.9" />
      <ellipse cx="293" cy="276" rx="3" ry="3" fill="#fff" opacity="0.8" />
      <!-- Nose bridge -->
      <path d="M 250 295 L 250 340" stroke="url(#goatGoldGrad)" stroke-width="3" opacity="0.4" />
      <!-- Snout / Muzzle -->
      <ellipse cx="250" cy="370" rx="55" ry="40" fill="url(#goatGoldGrad)" opacity="0.35" />
      <!-- Nostrils -->
      <ellipse cx="232" cy="365" rx="8" ry="5" fill="#000" opacity="0.7" />
      <ellipse cx="268" cy="365" rx="8" ry="5" fill="#000" opacity="0.7" />
      <!-- Mouth -->
      <path d="M 230 385 Q 250 398 270 385" fill="none" stroke="#000" stroke-width="2.5" opacity="0.5" stroke-linecap="round" />
      <!-- Beard -->
      <path d="M 240 415 Q 235 460 225 500 Q 222 515 230 510 Q 240 495 245 470" fill="none" stroke="url(#goatGoldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.5" />
      <path d="M 250 420 Q 250 470 250 520 Q 250 535 255 520 Q 255 470 252 430" fill="none" stroke="url(#goatGoldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
      <path d="M 260 415 Q 265 460 275 500 Q 278 515 270 510 Q 260 495 255 470" fill="none" stroke="url(#goatGoldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.5" />
      <!-- Chin tuft -->
      <path d="M 235 410 Q 250 430 265 410" fill="url(#goatGoldGrad)" opacity="0.3" />
    </g>

    <!-- Shine overlay on the goat -->
    <g mask="url(#shineMask)" opacity="0.5">
      <ellipse cx="250" cy="300" rx="120" ry="140" fill="white" />
    </g>
  </g>
  
  <rect width="6" height="150" x="25" y="35" fill="url(#gold)" rx="3" />
  
  <text x="50" y="65" font-family="'Space Grotesk', Arial, sans-serif" font-size="32" font-weight="900" fill="#ffffff">TN Voting</text>
