  <text x="50" y="130" font-family="Arial, sans-serif" font-size="15" fill="#cccccc" font-style="italic">A state-of-the-art modeling project engineered for secure and transparent voting systems.</text>
  <text x="50" y="165" font-family="Arial, sans-serif" font-size="14" fill="#a8862a" font-weight="bold">Core Tech: <tspan fill="#ffffff">Blockchain, Data Analytics, UI/UX</tspan></text>
  
  <!-- Interactive-looking Domain Badge on the Right -->
