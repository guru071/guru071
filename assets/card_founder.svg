<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c4314" />
      <stop offset="25%" stop-color="#c9a84c" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#8a6e27" />
    </linearGradient>
    <radialGradient id="g_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1405" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
  </defs>

  <rect width="796" height="216" x="2" y="2" fill="url(#g_bg)" rx="16" stroke="url(#gold)" stroke-width="2" />
  
  <text x="40" y="55" font-family="'Space Grotesk', Arial, sans-serif" font-size="28" font-weight="900" fill="url(#gold)">GURUPRASATH D</text>
  <text x="40" y="85" font-family="'Space Grotesk', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff" opacity="0.9">Founder &amp; CEO of GOAT'ECH and MAGH'S Technology</text>
  
  <line x1="40" y1="110" x2="760" y2="110" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.3" />
  
  <g transform="translate(40, 140)">
    <!-- GOAT'ECH Info -->
    <rect width="220" height="40" fill="#111" rx="6" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.4" />
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">GOAT'ECH (Est. Feb 2026)</text>
  </g>
  
  <g transform="translate(280, 140)">
    <!-- MAGH'S Info -->
    <rect width="220" height="40" fill="#111" rx="6" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.4" />
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">MAGH'S (Est. Oct 2024)</text>
  </g>
  
  <g transform="translate(520, 140)">
    <!-- Contact Info -->
    <rect width="240" height="40" fill="#111" rx="6" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.4" />
    <text x="120" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9a84c" text-anchor="middle">technology@goatech.tech</text>
  </g>
