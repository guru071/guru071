    <text x="150" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="url(#gold)" text-anchor="middle">AI &amp; Data</text>
    <text x="150" y="100" font-family="Arial" font-size="18" fill="#ccc" text-anchor="middle">Gemini LLMs</text>
    <text x="150" y="140" font-family="Arial" font-size="18" fill="#ccc" text-anchor="middle">RAG / LangChain</text>
