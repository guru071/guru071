    <text x="150" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="url(#gold)" text-anchor="middle">Backend</text>
    <text x="150" y="100" font-family="Arial" font-size="18" fill="#ccc" text-anchor="middle">Node.js / Express</text>
    <text x="150" y="140" font-family="Arial" font-size="18" fill="#ccc" text-anchor="middle">NestJS / Python</text>
    <text x="150" y="180" font-family="Arial" font-size="18" fill="#ccc" text-anchor="middle">PostgreSQL</text>
  </g>

  <g transform="translate(832, 200)">
