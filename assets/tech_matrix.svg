<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="600" viewBox="0 0 1664 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d780" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#8a6e27" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(201,168,76,0.05)" />
    </linearGradient>
  </defs>
  <rect width="1664" height="600" fill="url(#bg)" />
  
  <text x="832" y="100" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">TECHNOLOGY MATRIX</text>
  <path d="M 732 130 L 932 130" stroke="url(#gold)" stroke-width="4" />
  
  <!-- Boxes -->
  <g transform="translate(132, 200)">
    <rect width="300" height="250" rx="16" fill="url(#glass)" stroke="url(#gold)" stroke-width="2" />
    <text x="150" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="url(#gold)" text-anchor="middle">Frontend</text>
    <text x="150" y="100" font-family="Arial" font-size="18" fill="#ccc" text-anchor="middle">React &amp; Next.js</text>
    <text x="150" y="140" font-family="Arial" font-size="18" fill="#ccc" text-anchor="middle">TypeScript</text>
    <text x="150" y="180" font-family="Arial" font-size="18" fill="#ccc" text-anchor="middle">Tailwind CSS</text>
  </g>
  
  <g transform="translate(482, 200)">
