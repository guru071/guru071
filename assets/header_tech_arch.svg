<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="80" viewBox="0 0 1000 80">

  <defs>
    <!-- Liquid Glass Gold with active shine sweep -->
    <linearGradient id="gold" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#5c4314" />
      <stop offset="35%" stop-color="#c9a84c" />
      <stop offset="48%" stop-color="#f9ebbb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#f9ebbb" />
      <stop offset="65%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#5c4314" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.5 0" to="0.5 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>
    
    <radialGradient id="g_bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#110d05" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    
    <filter id="bg_glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <pattern id="grid_bg" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M55 0H0V55" fill="none" stroke="#c9a84c" stroke-opacity=".10"/>
    </pattern>
    
    <linearGradient id="goatGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c060" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#a8862a" />
    </linearGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="40%" stop-color="transparent" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.8)" />
      <stop offset="60%" stop-color="transparent" />
      <stop offset="100%" stop-color="transparent" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="2 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="goatGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <mask id="shineMask">
      <rect width="100%" height="100%" fill="url(#shineGrad)" />
    </mask>

  </defs>

  <rect width="996" height="76" x="2" y="2" fill="url(#g_bg)" rx="16" stroke="url(#gold)" stroke-width="2" />
  <rect width="996" height="76" x="2" y="2" fill="url(#grid_bg)" rx="16" />
  
  
  <!-- === GOAT FACE === -->
  <g class="goat-face" opacity="0.06" transform="translate(450.0, -20.0) scale(0.2)">
    <g filter="url(#goatGlow)">
      <!-- Left Horn -->
      <path d="M 155 200 Q 120 120 90 50 Q 85 35 100 40 Q 130 55 150 100 Q 165 140 170 185" fill="none" stroke="url(#goatGoldGrad)" stroke-width="12" stroke-linecap="round" />
      <!-- Right Horn -->
      <path d="M 345 200 Q 380 120 410 50 Q 415 35 400 40 Q 370 55 350 100 Q 335 140 330 185" fill="none" stroke="url(#goatGoldGrad)" stroke-width="12" stroke-linecap="round" />
      <!-- Left Ear -->
      <path d="M 145 210 Q 90 195 70 230 Q 60 260 100 260 Q 130 258 155 240" fill="url(#goatGoldGrad)" opacity="0.7" />
      <!-- Right Ear -->
      <path d="M 355 210 Q 410 195 430 230 Q 440 260 400 260 Q 370 258 345 240" fill="url(#goatGoldGrad)" opacity="0.7" />
      <!-- Head -->
      <ellipse cx="250" cy="300" rx="120" ry="140" fill="url(#goatGoldGrad)" opacity="0.5" />
      <!-- Forehead ridge -->
      <path d="M 170 230 Q 250 200 330 230" fill="none" stroke="url(#goatGoldGrad)" stroke-width="4" opacity="0.6" />
      <!-- Left Eye -->
      <ellipse cx="200" cy="280" rx="22" ry="16" fill="#000" opacity="0.9" />
      <ellipse cx="205" cy="278" rx="8" ry="8" fill="url(#goatGoldGrad)" opacity="0.9" />
      <ellipse cx="207" cy="276" rx="3" ry="3" fill="#fff" opacity="0.8" />
      <!-- Right Eye -->
      <ellipse cx="300" cy="280" rx="22" ry="16" fill="#000" opacity="0.9" />
      <ellipse cx="295" cy="278" rx="8" ry="8" fill="url(#goatGoldGrad)" opacity="0.9" />
      <ellipse cx="293" cy="276" rx="3" ry="3" fill="#fff" opacity="0.8" />
      <!-- Nose bridge -->
      <path d="M 250 295 L 250 340" stroke="url(#goatGoldGrad)" stroke-width="3" opacity="0.4" />
      <!-- Snout / Muzzle -->
      <ellipse cx="250" cy="370" rx="55" ry="40" fill="url(#goatGoldGrad)" opacity="0.35" />
      <!-- Nostrils -->
      <ellipse cx="232" cy="365" rx="8" ry="5" fill="#000" opacity="0.7" />
      <ellipse cx="268" cy="365" rx="8" ry="5" fill="#000" opacity="0.7" />
      <!-- Mouth -->
      <path d="M 230 385 Q 250 398 270 385" fill="none" stroke="#000" stroke-width="2.5" opacity="0.5" stroke-linecap="round" />
      <!-- Beard -->
      <path d="M 240 415 Q 235 460 225 500 Q 222 515 230 510 Q 240 495 245 470" fill="none" stroke="url(#goatGoldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.5" />
      <path d="M 250 420 Q 250 470 250 520 Q 250 535 255 520 Q 255 470 252 430" fill="none" stroke="url(#goatGoldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
      <path d="M 260 415 Q 265 460 275 500 Q 278 515 270 510 Q 260 495 255 470" fill="none" stroke="url(#goatGoldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.5" />
      <!-- Chin tuft -->
      <path d="M 235 410 Q 250 430 265 410" fill="url(#goatGoldGrad)" opacity="0.3" />
    </g>

    <!-- Shine overlay on the goat -->
    <g mask="url(#shineMask)" opacity="0.5">
      <ellipse cx="250" cy="300" rx="120" ry="140" fill="white" />
    </g>
  </g>
  
  <text x="500" y="48" font-family="'Space Grotesk', Arial, sans-serif" font-size="28" font-weight="900" fill="url(#gold)" text-anchor="middle" filter="url(#bg_glow)">🚀 TECHNOLOGY & ARCHITECTURE</text>
  <text x="500" y="48" font-family="'Space Grotesk', Arial, sans-serif" font-size="28" font-weight="900" fill="url(#gold)" text-anchor="middle">🚀 TECHNOLOGY & ARCHITECTURE</text>
</svg>
