<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="80" viewBox="0 0 1000 80">

  <defs>
    <!-- Liquid Glass Gold with active shine sweep -->
    <linearGradient id="gold_headerec" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#5c4314" />
      <stop offset="35%" stop-color="#c9a84c" />
      <stop offset="48%" stop-color="#f9ebbb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#f9ebbb" />
      <stop offset="65%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#5c4314" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.5 0" to="0.5 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>
    
    <radialGradient id="g_bg_headerec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#110d05" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    
    <filter id="bg_glow_headerec">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <pattern id="grid_bg_headerec" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M55 0H0V55" fill="none" stroke="#c9a84c" stroke-opacity=".10"/>
    </pattern>
    
    <linearGradient id="goatGoldGrad_headerec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c060" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#a8862a" />
    </linearGradient>

    <linearGradient id="shineGrad_headerec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="40%" stop-color="transparent" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.8)" />
      <stop offset="60%" stop-color="transparent" />
      <stop offset="100%" stop-color="transparent" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="2 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="goatGlow_headerec">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <mask id="shineMask_headerec">
      <rect width="100%" height="100%" fill="url(#shineGrad_headerec)" />
    </mask>

  </defs>

  <rect width="996" height="76" x="2" y="2" fill="url(#g_bg_headerec)" rx="16" stroke="url(#gold_headerec)" stroke-width="2" />
  <rect width="996" height="76" x="2" y="2" fill="url(#grid_bg_headerec)" rx="16" />
