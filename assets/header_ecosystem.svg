      <ellipse cx="295" cy="278" rx="8" ry="8" fill="url(#goatGoldGrad_headerec)" opacity="0.9" />
      <ellipse cx="293" cy="276" rx="3" ry="3" fill="#fff" opacity="0.8" />
      <!-- Nose bridge -->
      <path d="M 250 295 L 250 340" stroke="url(#goatGoldGrad_headerec)" stroke-width="3" opacity="0.4" />
      <!-- Snout / Muzzle -->
      <ellipse cx="250" cy="370" rx="55" ry="40" fill="url(#goatGoldGrad_headerec)" opacity="0.35" />
      <!-- Nostrils -->
      <ellipse cx="232" cy="365" rx="8" ry="5" fill="#000" opacity="0.7" />
      <ellipse cx="268" cy="365" rx="8" ry="5" fill="#000" opacity="0.7" />
      <!-- Mouth -->
      <path d="M 230 385 Q 250 398 270 385" fill="none" stroke="#000" stroke-width="2.5" opacity="0.5" stroke-linecap="round" />
      <!-- Beard -->
      <path d="M 240 415 Q 235 460 225 500 Q 222 515 230 510 Q 240 495 245 470" fill="none" stroke="url(#goatGoldGrad_headerec)" stroke-width="5" stroke-linecap="round" opacity="0.5" />
      <path d="M 250 420 Q 250 470 250 520 Q 250 535 255 520 Q 255 470 252 430" fill="none" stroke="url(#goatGoldGrad_headerec)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
      <path d="M 260 415 Q 265 460 275 500 Q 278 515 270 510 Q 260 495 255 470" fill="none" stroke="url(#goatGoldGrad_headerec)" stroke-width="5" stroke-linecap="round" opacity="0.5" />
      <!-- Chin tuft -->
      <path d="M 235 410 Q 250 430 265 410" fill="url(#goatGoldGrad_headerec)" opacity="0.3" />
    </g>

    <!-- Shine overlay on the goat -->
    <g mask="url(#shineMask_headerec)" opacity="0.5">
      <ellipse cx="250" cy="300" rx="120" ry="140" fill="white" />
