      <ellipse cx="205" cy="278" rx="8" ry="8" fill="url(#goatGoldGrad_headerec)" opacity="0.9" />
      <ellipse cx="207" cy="276" rx="3" ry="3" fill="#fff" opacity="0.8" />
      <!-- Right Eye -->
