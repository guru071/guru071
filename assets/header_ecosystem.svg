  <!-- === GOAT FACE === -->
  <g class="goat-face" opacity="0.06" transform="translate(450.0, -20.0) scale(0.2)">
    <g filter="url(#goatGlow_headerec)">
      <!-- Left Horn -->
      <path d="M 155 200 Q 120 120 90 50 Q 85 35 100 40 Q 130 55 150 100 Q 165 140 170 185" fill="none" stroke="url(#goatGoldGrad_headerec)" stroke-width="12" stroke-linecap="round" />
      <!-- Right Horn -->
      <path d="M 345 200 Q 380 120 410 50 Q 415 35 400 40 Q 370 55 350 100 Q 335 140 330 185" fill="none" stroke="url(#goatGoldGrad_headerec)" stroke-width="12" stroke-linecap="round" />
      <!-- Left Ear -->
      <path d="M 145 210 Q 90 195 70 230 Q 60 260 100 260 Q 130 258 155 240" fill="url(#goatGoldGrad_headerec)" opacity="0.7" />
      <!-- Right Ear -->
      <path d="M 355 210 Q 410 195 430 230 Q 440 260 400 260 Q 370 258 345 240" fill="url(#goatGoldGrad_headerec)" opacity="0.7" />
      <!-- Head -->
      <ellipse cx="250" cy="300" rx="120" ry="140" fill="url(#goatGoldGrad_headerec)" opacity="0.5" />
      <!-- Forehead ridge -->
      <path d="M 170 230 Q 250 200 330 230" fill="none" stroke="url(#goatGoldGrad_headerec)" stroke-width="4" opacity="0.6" />
      <!-- Left Eye -->
