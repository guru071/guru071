<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151515" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c4314" />
      <stop offset="30%" stop-color="#c9a84c" />
      <stop offset="48%" stop-color="#f9ebbb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#e6c875" />
      <stop offset="70%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#5c4314" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  
    <radialGradient id="g_bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3a2b08"/>
      <stop offset="45%" stop-color="#11100c"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="bg_glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid_bg" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M55 0H0V55" fill="none" stroke="#c9a84c" stroke-opacity=".10"/>
    </pattern>
  
    <!-- Goat Face Gradients -->
    <linearGradient id="goatGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c060" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#a8862a" />
    </linearGradient>

    <!-- Animated shine sweep -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="40%" stop-color="transparent" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.8)" />
      <stop offset="60%" stop-color="transparent" />
      <stop offset="100%" stop-color="transparent" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="2 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="goatGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <mask id="shineMask">
      <rect width="100%" height="100%" fill="url(#shineGrad)" />
    </mask>
      <clipPath id="photoClip"><circle cx="480" cy="480" r="250"/></clipPath>
  </defs>

  <rect width="960" height="960" fill="url(#g_bg)" rx="48" stroke="url(#gold)" stroke-width="4" />
  <rect width="960" height="960" fill="url(#grid_bg)" rx="48"   />

  
  
  
  


  
  
  <circle cx="480" cy="480" r="250" fill="none" stroke="url(#gold)" stroke-width="6" />

  <path fill="none" stroke="#c9a84c" stroke-opacity=".35" stroke-width="1.5">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 816.0 Q240.0 720.0 480.0 816.0 T960.0 816.0;
              M0 768.0 Q240.0 912.0 480.0 768.0 T960.0 768.0;
              M0 816.0 Q240.0 720.0 480.0 816.0 T960.0 816.0"/>
  </path>

  
  <circle cx="480" cy="480" r="300" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="10 15" opacity="0.5" />
  <circle cx="480" cy="480" r="220" fill="none" stroke="url(#gold)" stroke-width="6" filter="url(#glow)" />
  <circle cx="480" cy="480" r="180" fill="url(#gold)" opacity="0.1" />
  
  <text x="480" y="520" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">GOAT'ECH</text>
  <text x="480" y="600" font-family="Arial, sans-serif" font-size="30" font-weight="300" fill="#ffffff" text-anchor="middle">GURUPRASATH D</text>
</svg>
