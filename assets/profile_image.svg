<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <defs>
    <!-- Liquid Glass Gold with active shine sweep -->
    <linearGradient id="gold" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#5c4314" />
      <stop offset="35%" stop-color="#c9a84c" />
      <stop offset="48%" stop-color="#f9ebbb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#f9ebbb" />
      <stop offset="65%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#5c4314" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.5 0" to="0.5 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>
    
    <radialGradient id="g_bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a2b08"/>
      <stop offset="45%" stop-color="#11100c"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    
    <filter id="bg_glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="logoClip"><circle cx="480" cy="480" r="250"/></clipPath>
  </defs>

  <rect width="960" height="960" fill="url(#g_bg)" rx="48" stroke="url(#gold)" stroke-width="4" />

  <image href="data:image/jpeg;base64," x="230" y="230" width="500" height="500" clip-path="url(#logoClip)" preserveAspectRatio="xMidYMid slice" opacity="0.95" />
  
  <circle cx="480" cy="480" r="250" fill="none" stroke="url(#gold)" stroke-width="6" />
  <circle cx="480" cy="480" r="300" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="10 15" opacity="0.5" />
  <circle cx="480" cy="480" r="220" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" />
</svg>
