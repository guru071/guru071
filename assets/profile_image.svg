<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151515" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d780" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#8a6e27" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="960" height="960" fill="url(#bg)" rx="48" stroke="url(#gold)" stroke-width="4" />
  
  <circle cx="480" cy="480" r="300" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="10 15" opacity="0.5" />
  <circle cx="480" cy="480" r="220" fill="none" stroke="url(#gold)" stroke-width="6" filter="url(#glow)" />
  <circle cx="480" cy="480" r="180" fill="url(#gold)" opacity="0.1" />
  
  <text x="480" y="520" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">GOAT'ECH</text>
  <text x="480" y="600" font-family="Arial, sans-serif" font-size="30" font-weight="300" fill="#ffffff" text-anchor="middle">GURUPRASATH D</text>
</svg>
