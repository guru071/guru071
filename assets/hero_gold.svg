<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="400" viewBox="0 0 1664 400">
  <defs>
    <!-- Liquid Glass Gold with active shine sweep -->
    <linearGradient id="gold" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#5c4314" />
      <stop offset="35%" stop-color="#c9a84c" />
      <stop offset="48%" stop-color="#f9ebbb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#f9ebbb" />
      <stop offset="65%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#5c4314" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.5 0" to="0.5 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>
    
    <radialGradient id="g_bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3a2b08"/>
      <stop offset="45%" stop-color="#11100c"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    
    <filter id="bg_glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <pattern id="grid_bg" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M55 0H0V55" fill="none" stroke="#c9a84c" stroke-opacity=".10"/>
    </pattern>

    <clipPath id="heroPhotoClip"><circle cx="250" cy="200" r="120"/></clipPath>
  </defs>

  <rect width="1664" height="400" fill="url(#g_bg)" rx="16" />
  <rect width="1664" height="400" fill="url(#grid_bg)" rx="16" />

  <!-- Background Sparks -->
  <g opacity=".55" filter="url(#bg_glow)">
    <circle cx="15%" cy="25%" r="2.5" fill="#fff3ad">
      <animate attributeName="cy" values="25%;15%;25%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25%" cy="75%" r="2" fill="#c9a84c">
      <animate attributeName="cx" values="25%;30%;25%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.9;.1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75%" cy="30%" r="2.5" fill="#fff3ad">
      <animate attributeName="cy" values="30%;20%;30%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85%" cy="70%" r="2" fill="#c9a84c">
      <animate attributeName="cx" values="85%;80%;85%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.8;.1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <path fill="none" stroke="#c9a84c" stroke-opacity=".35" stroke-width="1.5">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 340.0 Q416.0 300.0 832.0 340.0 T1664.0 340.0;
              M0 320.0 Q416.0 380.0 832.0 320.0 T1664.0 320.0;
              M0 340.0 Q416.0 300.0 832.0 340.0 T1664.0 340.0"/>
  </path>
  
  <!-- Glass Panel Container -->
  <rect x="50" y="50" width="1564" height="300" rx="16" fill="rgba(0,0,0,0.4)" stroke="url(#gold)" stroke-width="2" />
  
  <!-- Profile Photo (Using tiny Base64 so it won't break) -->
  <image href="data:image/jpeg;base64," x="130" y="80" width="240" height="240" clip-path="url(#heroPhotoClip)" preserveAspectRatio="xMidYMid slice" opacity="0.95" />
  
  <circle cx="250" cy="200" r="120" fill="none" stroke="url(#gold)" stroke-width="6" />
  <circle cx="250" cy="200" r="130" fill="none" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="10 15" />
  
  <!-- Single Clean Text Block -->
  <text x="450" y="150" font-family="'Space Grotesk', Arial, sans-serif" font-size="75" font-weight="900" fill="#ffffff">GURUPRASATH D</text>
  <text x="450" y="210" font-family="'Space Grotesk', Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#gold)">Founder &amp; CEO of GOAT'ECH and MAGH'S</text>
  <text x="450" y="260" font-family="'Space Grotesk', monospace" font-size="22" font-weight="600" fill="#cccccc" letter-spacing="4">IDEA | BUILD | EXPERIMENT</text>
  
  <!-- Developer Badge -->
  <rect x="450" y="280" width="260" height="40" rx="8" fill="#111" stroke="url(#gold)" stroke-width="2" />
  <text x="580" y="306" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Full-Stack Software Architect</text>
</svg>
