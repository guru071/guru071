<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="400" viewBox="0 0 1664 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c875" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#8a6e27" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(201,168,76,0.1)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.8)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1664" height="400" fill="url(#bgGrad)" rx="16" />
  
  <!-- Glass Panels -->
  <rect x="50" y="50" width="1564" height="300" rx="16" fill="url(#glassGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  
  <text x="832" y="180" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">GURUPRASATH D</text>
  <text x="832" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="300" fill="#ffffff" text-anchor="middle" letter-spacing="4">SOFTWARE ARCHITECT &amp; FOUNDER</text>
  
  <circle cx="832" cy="320" r="6" fill="url(#goldGrad)" />
  <circle cx="802" cy="320" r="4" fill="#ffffff" opacity="0.5" />
  <circle cx="862" cy="320" r="4" fill="#ffffff" opacity="0.5" />
</svg>
