<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="600" viewBox="0 0 1664 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d780" />
      <stop offset="50%" stop-color="#c9a84c" />
      <stop offset="100%" stop-color="#8a6e27" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(201,168,76,0.15)" />
      <stop offset="100%" stop-color="rgba(201,168,76,0.02)" />
    </linearGradient>
  
    <radialGradient id="g_bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3a2b08"/>
      <stop offset="45%" stop-color="#11100c"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="bg_glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid_bg" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M55 0H0V55" fill="none" stroke="#c9a84c" stroke-opacity=".10"/>
    </pattern>
  </defs>

  <rect width="1664" height="600" fill="url(#g_bg)" />
  <rect width="1664" height="600" fill="url(#grid_bg)" />

  <g opacity=".55" filter="url(#bg_glow)">
    <circle cx="15%" cy="25%" r="2.5" fill="#fff3ad">
      <animate attributeName="cy" values="25%;15%;25%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25%" cy="75%" r="2" fill="#c9a84c">
      <animate attributeName="cx" values="25%;30%;25%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.9;.1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75%" cy="30%" r="2.5" fill="#fff3ad">
      <animate attributeName="cy" values="30%;20%;30%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85%" cy="70%" r="2" fill="#c9a84c">
      <animate attributeName="cx" values="85%;80%;85%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.8;.1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <path fill="none" stroke="#c9a84c" stroke-opacity=".35" stroke-width="1.5">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 510.0 Q416.0 450.0 832.0 510.0 T1664.0 510.0;
              M0 480.0 Q416.0 570.0 832.0 480.0 T1664.0 480.0;
              M0 510.0 Q416.0 450.0 832.0 510.0 T1664.0 510.0"/>
  </path>

  
  <text x="832" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">SYSTEM ARCHITECTURE</text>
  <path d="M 700 110 L 964 110" stroke="url(#gold)" stroke-width="4" />
  
  <!-- Client Layer -->
  <rect x="232" y="180" width="1200" height="80" rx="16" fill="url(#glass)" stroke="url(#gold)" stroke-width="2" />
  <text x="832" y="230" font-family="Arial" font-size="28" font-weight="bold" fill="url(#gold)" text-anchor="middle">Client &amp; Presentation Layer (React / Next.js / Tailwind)</text>
  
  <path d="M 832 260 L 832 320" stroke="url(#gold)" stroke-width="4" stroke-dasharray="10 10" />
  <polygon points="822,310 842,310 832,325" fill="url(#gold)" />

  <!-- API Layer -->
  <rect x="232" y="330" width="1200" height="80" rx="16" fill="url(#glass)" stroke="url(#gold)" stroke-width="2" />
  <text x="832" y="380" font-family="Arial" font-size="28" font-weight="bold" fill="url(#gold)" text-anchor="middle">API &amp; Business Logic (Node.js / Python / FastAPI)</text>
  
  <path d="M 832 410 L 832 470" stroke="url(#gold)" stroke-width="4" stroke-dasharray="10 10" />
  <polygon points="822,460 842,460 832,475" fill="url(#gold)" />

  <!-- Data & Infrastructure Layer -->
  <rect x="232" y="480" width="1200" height="80" rx="16" fill="url(#glass)" stroke="url(#gold)" stroke-width="2" />
  <text x="832" y="530" font-family="Arial" font-size="28" font-weight="bold" fill="url(#gold)" text-anchor="middle">Data &amp; Cloud Infrastructure (PostgreSQL / AWS / Docker)</text>
</svg>
