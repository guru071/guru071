<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#050505"/>
    <stop offset="55%" stop-color="#15120b"/>
    <stop offset="100%" stop-color="#050505"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" x2="1">
    <stop offset="0%" stop-color="#c9a84c"/>
    <stop offset="50%" stop-color="#fff3ad"/>
    <stop offset="100%" stop-color="#c9a84c"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0%" stop-color="#fff3ad" stop-opacity=".22"/>
    <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="portrait"><circle cx="1110" cy="260" r="180"/></clipPath>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1400" height="520" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="260" r="260" fill="url(#halo)" filter="url(#blur)">
  <animate attributeName="r" values="240;275;240" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- Animated premium background lines -->
<g fill="none" stroke="#c9a84c" stroke-opacity=".14">
  <path d="M0 410 C350 260 500 520 850 360 S1200 220 1400 340">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0 410 C350 260 500 520 850 360 S1200 220 1400 340;
              M0 360 C350 520 500 250 850 410 S1200 300 1400 390;
              M0 410 C350 260 500 520 850 360 S1200 220 1400 340"/>
  </path>
  <circle cx="1110" cy="260" r="205">
    <animateTransform attributeName="transform" type="rotate" from="0 1110 260" to="360 1110 260" dur="26s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Portrait -->
<circle cx="1110" cy="260" r="190" fill="#050505" stroke="url(#gold)" stroke-width="3"/>
<image href="profile.jpg" x="930" y="80" width="360" height="360" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/>
<circle cx="1110" cy="260" r="190" fill="none" stroke="#fff3ad" stroke-opacity=".35" stroke-width="1">
  <animate attributeName="r" values="190;202;190" dur="3.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".8;.2;.8" dur="3.5s" repeatCount="indefinite"/>
</circle>

<!-- Text -->
<text x="90" y="145" fill="#fff3ad" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">GOAT'ECH • PERSONAL PROFILE</text>
<text x="90" y="225" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800">GURUPRASATH D</text>
<text x="94" y="270" fill="#c9a84c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">FOUNDER • BUILDER • CREATOR</text>
<text x="94" y="320" fill="#d8d8d8" font-family="Arial, Helvetica, sans-serif" font-size="20">Founder &amp; CEO of GOAT'ECH and MAGH'S Technology</text>

<g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
  <rect x="90" y="365" width="160" height="46" rx="23" fill="#c9a84c"/>
  <text x="170" y="395" text-anchor="middle" fill="#080808">GOAT'ECH</text>
  <rect x="265" y="365" width="160" height="46" rx="23" fill="none" stroke="#c9a84c"/>
  <text x="345" y="395" text-anchor="middle" fill="#fff3ad">MAGH'S</text>
</g>

<text x="90" y="465" fill="#777" font-family="monospace" font-size="15">IDEA → BUILD → IMPROVE → CREATE</text>
</svg>